[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillaudit"
version = "1.0.0"
description = "Agent Skills (SKILL.md) 规范校验与安全审计引擎 · specification & security audit engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SkillAudit contributors" }]
keywords = [
    "agent-skills",
    "skill",
    "llm",
    "ai-agent",
    "static-analysis",
    "security-audit",
    "lint",
    "sarif",
    "claude-code",
    "codex",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
# Zero third-party dependencies by design: the tool must run inside air-gapped
# CI runners and agent sandboxes without any network access.
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/gitstq/SkillAudit"
Repository = "https://github.com/gitstq/SkillAudit"
Issues = "https://github.com/gitstq/SkillAudit/issues"

[project.scripts]
skaudit = "skillaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
skillaudit = ["py.typed"]
